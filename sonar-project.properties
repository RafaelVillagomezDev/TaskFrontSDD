# Análisis de SonarQube (CONSTITUTION.md IV.6; AGENTS.md §7)
# Sin sonar.projectKey: cada rama de git se analiza en su propio proyecto, taskfrontsdd-<rama>,
# que fija scripts/sonar-scan.sh
sonar.sourceEncoding=UTF-8

# Código de producción: src/ sin sus subcarpetas tests/
sonar.sources=src
sonar.exclusions=src/**/tests/**

# Tests: las subcarpetas tests/ de src/ y las E2E
sonar.tests=src,e2e
sonar.test.inclusions=src/**/tests/**,e2e/**

# Ficheros sin lógica fuera de la cobertura (CONSTITUTION.md IV.4, excepción)
sonar.coverage.exclusions=src/**/*.types.ts,src/**/*.texts.ts,src/**/*.constants.ts,src/main.tsx,src/shared/config/env.ts

# Cobertura de `pnpm test:coverage`, con rutas relativas a la raíz
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
