# Solo para las E2E de seguridad (spec 004 RF-25, plan D-11): el servicio pre de docker-compose.dev.yml monta este
# fragmento para escribir también el registro de accesos en un fichero que la E2E puede leer (.nginx-logs/ del
# repositorio). La imagen no lo incluye: en preproducción y producción el registro solo va a la salida del contenedor
access_log /var/log/nginx-test/access.log client_ip;
