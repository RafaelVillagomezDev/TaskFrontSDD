# Proxy inverso de la aplicación: reglas de cada server que sirve la app (spec 004 RF-20 a RF-25). Contexto server

# Solo GET y HEAD (RF-22): una SPA estática no recibe nada más
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# Registro de accesos con la IP real (RF-25) y conexiones inactivas cortadas a los 15 s (RF-24). Van aquí porque el
# nginx.conf de la imagen ya los define en el contexto http
access_log /var/log/nginx/access.log client_ip;
keepalive_timeout 15s;

# Límites por IP para todas las rutas (RF-20, RF-21)
limit_req zone=per_ip_requests burst=60 nodelay;
limit_conn per_ip_connections 30;

# Rutas de escáneres (RF-23): ficheros ocultos (.env, .git), scripts de servidor, mapas de código y copias de
# seguridad. Responden 404 sin servir index.html, para no parecer que existen
location ~ /\. {
    return 404;
}

location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|sh|sql|bak|old|orig|swp|map|ini|log|yml|yaml|env)$ {
    return 404;
}
