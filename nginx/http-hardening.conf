# Proxy inverso de la aplicación: tráfico por IP (spec 004 RF-19 a RF-21, RF-24 y RF-25). Contexto http:
# se incluye al principio de pre.conf.template y pro.conf.template, antes de sus server

# Sin la versión de Nginx en las cabeceras ni en las páginas de error (RF-13)
server_tokens off;

# IP real del cliente (RF-19): el proxy de Dokploy (Traefik) llega por la red privada de Docker y añade la IP del
# cliente en X-Forwarded-For. Solo se confía en esas redes; el contenedor no es accesible desde fuera
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Límites por IP (RF-20, RF-21). Una carga de la app son unas 15 peticiones: 20 por segundo con ráfagas de 60 no
# molesta a un usuario y frena a quien abusa. Pasarse responde 429
limit_req_zone $binary_remote_addr zone=per_ip_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
limit_req_status 429;
limit_conn_status 429;

# Tamaños y tiempos (RF-24): la app es estática y no recibe cuerpos (0 quitaría el límite, por eso 1k); las conexiones lentas se cortan a los 10 s
client_max_body_size 1k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
large_client_header_buffers 4 8k;

# Formato del registro de accesos con la IP real (RF-25); el access_log va en server-hardening.conf, que sustituye al
# del nginx.conf de la imagen en vez de duplicar cada línea
log_format client_ip '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
