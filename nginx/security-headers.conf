# Cabeceras de seguridad comunes a pre y pro (spec 004 RF-09 a RF-12 y RF-15). Se incluyen en cada location porque
# add_header no se hereda en cuanto una location declara el suyo

# CSP (RF-12): recursos propios, más las hojas de estilo y las fuentes de Google Fonts. Conexiones solo con la propia
# app y con TaskApiSDD ($api_origin: https://apikompitu.yandrydev.cloud en producción). Sin iframes en ningún sentido:
# la app no carga marcos (frame-src, child-src) ni se deja meter en uno (frame-ancestors). Sin plugins (object-src) y
# con Trusted Types: el HTML que escriban los scripts tiene que pasar por una política, lo que corta las inyecciones
# en el DOM
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' $api_origin; frame-src 'none'; child-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'" always;

# Capacidades del navegador que la app no usa, desactivadas para ella y para cualquier marco (RF-09). No se toca
# autoplay: el aviso de fin del pomodoro usa Web Audio (003 RF-19)
add_header Permissions-Policy "accelerometer=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# Ventana aislada de las que abra o la abran desde otro sitio (RF-10) y recursos solo para la propia app (RF-11)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Las que ya había (RF-15). X-Frame-Options: DENY repite frame-ancestors 'none' para navegadores antiguos
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
